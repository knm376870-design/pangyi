[package]
name = "pangyi_ime"
version = "1.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
panic = "abort"
opt-level = "z"

[dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_TextServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "implement", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }
